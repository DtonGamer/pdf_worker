[build]
builder = "docker"
command = "docker build -t worker ."

[deploy]
startCommand = "python -u worker.py"

[build.env]
PYTHON_VERSION = "3.11"

[env]
# Supabase Configuration
SUPABASE_URL = { required = true, description = "Your Supabase project URL" }
SUPABASE_SERVICE_KEY = { required = true, description = "Your Supabase service role key" }

# Redis Configuration
REDIS_URL = { required = true, description = "Redis connection URL" }

# Processing Configuration (with defaults)
BATCH_SIZE = { default = "4", description = "Batch size for processing" }
CHUNK_SIZE = { default = "500", description = "Token size per chunk" }
CHUNK_OVERLAP = { default = "50", description = "Token overlap between chunks" }

# OCR Configuration
OCR_LANGUAGES = { default = "eng", description = "OCR languages (comma-separated)" }
OCR_DPI = { default = "300", description = "OCR DPI setting" }

# Embedding Configuration
EMBEDDING_MODEL = { default = "all-MiniLM-L6-v2", description = "Embedding model to use" }

# Logging Configuration
LOG_LEVEL = { default = "INFO", description = "Logging level" }

# Worker Configuration
WORKER_ID = { description = "Unique worker identifier" }
HIGH_PRIORITY_QUEUE = { default = "pdf-processing-high", description = "High priority queue name" }
DEFAULT_QUEUE = { default = "pdf-processing", description = "Default queue name" }
LOW_PRIORITY_QUEUE = { default = "pdf-processing-low", description = "Low priority queue name" }
