# ============================================================================
# DOCKER COMPOSE: Local Development Setup
# ============================================================================
# This file is for local testing only. In production, deploy worker separately.

version: '3.8'

services:
  # Redis Queue (for local testing)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PDF Processing Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Supabase (replace with your values)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}

      # Redis (local)
      - REDIS_URL=redis://redis:6379

      # Processing config
      - BATCH_SIZE=32
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
      - OCR_LANGUAGES=eng
      - OCR_DPI=300
      - LOG_LEVEL=INFO
    volumes:
      - ./:/app
      - /tmp/pdf-processing:/tmp/pdf-processing
    restart: unless-stopped

volumes:
  redis_data:
